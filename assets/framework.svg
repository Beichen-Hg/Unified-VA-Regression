<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
<title id="title">Foundation Learning and Conditional Specialization</title>
<desc id="desc">A shared foundation is trained on text-aspect pairs. Its selected weights initialize Stage 2, which derives language and domain conditions from input hidden states and adds four residual branches before VA regression.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52657a"/></marker></defs>
<rect width="1120" height="390" rx="12" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#1d2b3a">
  <text x="32" y="34" font-size="17" font-weight="700">One model for multilingual and multidomain valence–arousal regression</text>
  <rect x="28" y="60" width="310" height="290" rx="12" fill="white" stroke="#c6d8e6"/>
  <text x="48" y="90" font-size="17" font-weight="700" fill="#28618c">Stage 1 · Foundation Learning</text>
  <rect x="55" y="115" width="256" height="43" rx="7" fill="#eaf2f8"/>
  <text x="183" y="141" text-anchor="middle" font-size="15">Text + target aspect</text>
  <path d="M183 159 V182" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="55" y="188" width="256" height="58" rx="7" fill="#eaf2f8"/>
  <text x="183" y="212" text-anchor="middle" font-size="15">Qwen3-8B-Base</text>
  <text x="183" y="233" text-anchor="middle" font-size="13" fill="#52657a">Shared regression foundation</text>
  <path d="M183 247 V270" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="55" y="277" width="256" height="43" rx="7" fill="#eaf2f8"/>
  <text x="183" y="303" text-anchor="middle" font-size="15">Gated pooling + VA head</text>
  <path d="M340 211 H396" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="368" y="179" text-anchor="middle" font-size="12" fill="#52657a">Selected</text>
  <text x="368" y="195" text-anchor="middle" font-size="12" fill="#52657a">weights</text>
  <rect x="408" y="60" width="682" height="290" rx="12" fill="white" stroke="#bcd8d3"/>
  <text x="429" y="90" font-size="17" font-weight="700" fill="#26776a">Stage 2 · Conditional Specialization</text>
  <rect x="430" y="117" width="197" height="48" rx="7" fill="#e9f4f0"/>
  <text x="528" y="146" text-anchor="middle" font-size="15">Text + target aspect</text>
  <path d="M528 166 V191" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="198" width="197" height="64" rx="7" fill="#e9f4f0"/>
  <text x="528" y="224" text-anchor="middle" font-size="15">Decoder hidden states</text>
  <text x="528" y="246" text-anchor="middle" font-size="13" fill="#52657a">Upper layers 24–35</text>
  <path d="M628 229 H661" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="669" y="117" width="206" height="48" rx="7" fill="#e9f4f0"/>
  <text x="772" y="137" text-anchor="middle" font-size="14">Input-derived language</text>
  <text x="772" y="155" text-anchor="middle" font-size="14">and domain conditions</text>
  <path d="M627 214 L648 214 L648 142 H664" stroke="#52657a" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
  <path d="M772 167 V190" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="669" y="198" width="206" height="64" rx="7" fill="#e9f4f0"/>
  <text x="772" y="222" text-anchor="middle" font-size="14">Shared · Language · Domain</text>
  <text x="772" y="243" text-anchor="middle" font-size="14">Composition residuals</text>
  <path d="M876 229 H907" stroke="#52657a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="915" y="198" width="151" height="64" rx="7" fill="#e9f4f0"/>
  <text x="990" y="222" text-anchor="middle" font-size="15">Pooling + VA head</text>
  <text x="990" y="244" text-anchor="middle" font-size="13" fill="#52657a">Valence / arousal</text>
  <text x="431" y="299" font-size="13" fill="#52657a">Training: VA regression + auxiliary condition supervision</text>
  <text x="431" y="323" font-size="13" fill="#52657a">Inference: text and aspect → continuous VA scores in [1, 9]</text>
</g></svg>
