<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Unified valence–arousal regression: foundation and specialization</title>
  <desc id="desc">Stage 1 learns shared pooling and regression from text and aspect. Its selected weights initialize Stage 2. At decoder layers 24–35, masked hidden states infer continuous conditions for zero-initialized Global, Language, Domain, and Compound residual branches. Language and domain labels supervise training classifiers only. Development-only distribution-preserving selection chooses the Stage 2 checkpoint.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="500" rx="16" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" fill="#0f172a">
    <text x="28" y="36" font-size="21" font-weight="700">One model. Multiple languages and domains.</text>
    <text x="1172" y="35" text-anchor="end" font-size="13" fill="#64748b">Text + aspect → valence and arousal</text>
    <rect x="28" y="62" width="320" height="350" rx="13" fill="#fff" stroke="#cbd5e1"/>
    <rect x="46" y="80" width="29" height="29" rx="8" fill="#2563eb"/>
    <text x="60.5" y="100" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="86" y="101" font-size="18" font-weight="700" fill="#1e40af">Shared foundation</text>
    <rect x="53" y="131" width="270" height="43" rx="8" fill="#eff6ff" stroke="#dbeafe"/>
    <text x="188" y="158" font-size="15" text-anchor="middle">Text + target aspect</text>
    <path d="M188 175 V198" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
    <rect x="53" y="206" width="270" height="64" rx="8" fill="#eff6ff" stroke="#dbeafe"/>
    <text x="188" y="233" font-size="16" text-anchor="middle" font-weight="600">Qwen3-8B-Base</text>
    <text x="188" y="254" font-size="13" text-anchor="middle" fill="#475569">Train upper decoder layers 24–35</text>
    <path d="M188 272 V293" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
    <rect x="53" y="301" width="270" height="60" rx="8" fill="#eff6ff" stroke="#dbeafe"/>
    <text x="188" y="326" font-size="15" text-anchor="middle">Gated last/mean pooling</text>
    <text x="188" y="347" font-size="14" text-anchor="middle" fill="#475569">Shared MLP → V / A branches</text>
    <text x="188" y="390" font-size="13" text-anchor="middle" fill="#64748b">12 in-pool training targets</text>
    <path d="M349 238 H388" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
    <text x="369" y="208" text-anchor="middle" font-size="10" fill="#64748b">Same</text>
    <text x="369" y="222" text-anchor="middle" font-size="10" fill="#64748b">seed</text>
    <rect x="396" y="62" width="776" height="350" rx="13" fill="#fff" stroke="#cbd5e1"/>
    <rect x="414" y="80" width="29" height="29" rx="8" fill="#0f766e"/>
    <text x="428.5" y="100" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="454" y="101" font-size="18" font-weight="700" fill="#115e59">Conditional residual specialization</text>
    <rect x="417" y="131" width="202" height="43" rx="8" fill="#f0fdfa" stroke="#ccfbf1"/>
    <text x="518" y="158" font-size="15" text-anchor="middle">Text + target aspect</text>
    <path d="M518 175 V214" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
    <rect x="417" y="222" width="202" height="67" rx="8" fill="#f0fdfa" stroke="#ccfbf1"/>
    <text x="518" y="249" font-size="15" text-anchor="middle">Decoder hidden states</text>
    <text x="518" y="272" font-size="13" text-anchor="middle" fill="#475569">At each layer 24–35</text>
    <path d="M620 243 H632 V159 H645" stroke="#64748b" stroke-width="1.7" fill="none" marker-end="url(#arrow)"/>
    <rect x="653" y="131" width="232" height="58" rx="8" fill="#f0fdfa" stroke="#ccfbf1"/>
    <text x="769" y="154" font-size="14" text-anchor="middle">Masked mean → condition MLP</text>
    <text x="769" y="176" font-size="13" text-anchor="middle" fill="#475569">Input-derived language + domain</text>
    <path d="M769 190 V213" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
    <path d="M620 270 H645" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
    <rect x="653" y="222" width="232" height="111" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="769" y="244" font-size="13" text-anchor="middle" font-weight="600" fill="#115e59">Zero-initialized residuals</text>
    <rect x="665" y="255" width="98" height="27" rx="5" fill="#fff"/>
    <rect x="775" y="255" width="98" height="27" rx="5" fill="#fff"/>
    <rect x="665" y="292" width="98" height="27" rx="5" fill="#fff"/>
    <rect x="775" y="292" width="98" height="27" rx="5" fill="#fff"/>
    <text x="714" y="274" font-size="13" text-anchor="middle">Global</text>
    <text x="824" y="274" font-size="13" text-anchor="middle">Language</text>
    <text x="714" y="311" font-size="13" text-anchor="middle">Domain</text>
    <text x="824" y="311" font-size="13" text-anchor="middle">Compound</text>
    <path d="M886 270 H908" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
    <rect x="916" y="222" width="234" height="67" rx="8" fill="#f0fdfa" stroke="#ccfbf1"/>
    <text x="1033" y="248" font-size="15" text-anchor="middle">Residual sum + VA readout</text>
    <text x="1033" y="272" font-size="13" text-anchor="middle" fill="#475569">Continuous scores in [1, 9]</text>
    <text x="1033" y="161" font-size="13" text-anchor="middle" fill="#0f766e">No condition labels</text>
    <text x="1033" y="179" font-size="13" text-anchor="middle" fill="#0f766e">at inference</text>
    <text x="418" y="365" font-size="13" fill="#475569">Training: Huber regression + 0.10 × auxiliary language/domain CE</text>
    <text x="418" y="389" font-size="13" fill="#64748b">Selected Stage 1 weights · fresh optimizer · shared input template</text>
    <rect x="28" y="434" width="1144" height="43" rx="9" fill="#e2e8f0"/>
    <text x="48" y="461" font-size="14" font-weight="700">DP selection</text>
    <text x="170" y="461" font-size="14" fill="#334155">Development only · macro error + tail risk + pseudo-OOD + spread + correlation floors</text>
  </g>
</svg>
