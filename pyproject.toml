[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-va-regression"
version = "0.1.0"
description = "Code for Unified Multilingual and Multidomain Valence-Arousal Regression"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.9,<2.10", "transformers==4.56.1", "numpy==1.26.4",
  "scipy==1.13.1", "scikit-learn==1.8.0", "PyYAML==6.0.2",
  "pandas==2.3.1", "tqdm==4.67.1", "accelerate==1.10.1", "safetensors==0.6.2",
]

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]

[project.scripts]
unified-va = "unified_va.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["unified_va*"]
namespaces = true

[tool.setuptools.package-data]
unified_va = ["configs/*.json", "resources/*.json", "engines/stage2/protocol/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
